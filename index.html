<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7c4dff" />
  <title>Rekenavontuur 🧮</title>
  <!-- The web version is unlisted: people should get the app from the stores. -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rekenen" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Keuzescherm ===== -->
  <section id="scrHome" class="screen menu">
    <header class="topbar">
      <div class="score" aria-label="Sterren">
        <span class="score-star">⭐</span>
        <span class="js-score">0</span>
      </div>
      <button class="icon-btn js-settings push-right" aria-label="Instellingen">⚙️</button>
    </header>
    <div class="menu-body">
      <div class="mascot" id="homeMascot">🦄</div>
      <h1 class="home-title" id="homeTitle">Rekenavontuur</h1>
      <p class="home-sub" id="homeSub">Wat wil je spelen?</p>
      <div class="gamecards">
        <button class="gamecard" id="btnReeksen">
          <span class="gc-icon">🔗</span>
          <span class="gc-name" id="gcReeksenName">Rekenreeksen</span>
          <span class="gc-desc" id="gcReeksenDesc">Plus, min, keer en delen —<br>het antwoord telt door!</span>
        </button>
        <button class="gamecard" id="btnSplitsen">
          <span class="gc-diagram" aria-hidden="true">
            <svg viewBox="0 0 100 60" preserveAspectRatio="none">
              <line x1="50" y1="16" x2="20" y2="48" vector-effect="non-scaling-stroke"></line>
              <line x1="50" y1="16" x2="80" y2="48" vector-effect="non-scaling-stroke"></line>
            </svg>
            <span class="gd top">10</span>
            <span class="gd left">4</span>
            <span class="gd right">?</span>
          </span>
          <span class="gc-name" id="gcSplitsName">Splitsen</span>
          <span class="gc-desc" id="gcSplitsDesc">Splits het getal in twee stukjes.<br>Haal jij 10 op een rij?</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== Rekenreeksen ===== -->
  <section id="scrReeksen" class="screen game" hidden>
    <header class="topbar">
      <button class="icon-btn js-home" aria-label="Naar het keuzescherm">🏠</button>
      <div class="score" aria-label="Sterren">
        <span class="score-star">⭐</span>
        <span class="js-score">0</span>
      </div>
      <div class="streak" id="streakBox" title="Reeks">
        <span id="streakFlame">🔥</span>
        <span id="streakValue">0</span>
      </div>
      <button class="icon-btn js-settings push-right" aria-label="Instellingen">⚙️</button>
    </header>

    <main class="play">
      <div class="mascot" id="mascot">🦄</div>

      <div class="equation" id="equation">
        <span class="operand" id="opA">3</span>
        <span class="operator" id="operator">+</span>
        <span class="operand" id="opB">4</span>
        <span class="equals">=</span>
        <span class="answer-box" id="answerBox">?</span>
      </div>

      <div class="feedback" id="feedback"></div>
    </main>

    <section class="numpad" id="numpad">
      <button class="key num" data-key="1">1</button>
      <button class="key num" data-key="2">2</button>
      <button class="key num" data-key="3">3</button>
      <button class="key num" data-key="4">4</button>
      <button class="key num" data-key="5">5</button>
      <button class="key num" data-key="6">6</button>
      <button class="key num" data-key="7">7</button>
      <button class="key num" data-key="8">8</button>
      <button class="key num" data-key="9">9</button>
      <button class="key action clear" data-key="clear" aria-label="Wissen">⌫</button>
      <button class="key num" data-key="0">0</button>
      <button class="key action check" data-key="check" aria-label="Controleer antwoord">✓</button>
    </section>
  </section>

  <!-- ===== Splitsen · keuze ===== -->
  <section id="scrSplitsSetup" class="screen menu" hidden>
    <header class="topbar">
      <button class="icon-btn js-home" aria-label="Naar het keuzescherm">🏠</button>
      <div class="score push-right" aria-label="Sterren">
        <span class="score-star">⭐</span>
        <span class="js-score">0</span>
      </div>
    </header>
    <div class="menu-body">
      <div class="mascot">🐸</div>
      <h2 class="bigq" id="splitsQ">Welk getal ga je splitsen?</h2>
      <div class="numchoices">
        <button class="numchoice c5" data-total="5">5</button>
        <button class="numchoice c10" data-total="10">10</button>
        <button class="numchoice rnd" data-total="rnd">?<small id="rndLabel">verrassing</small></button>
      </div>
    </div>
  </section>

  <!-- ===== Splitsen · spel ===== -->
  <section id="scrSplits" class="screen game" hidden>
    <header class="topbar">
      <button class="icon-btn js-home" aria-label="Naar het keuzescherm">🏠</button>
      <div class="score push-right" aria-label="Voortgang: 10 op een rij">
        <span class="score-star">⭐</span>
        <span id="splitsCount">0/10</span>
      </div>
    </header>

    <main class="play">
      <div class="mascot" id="splitsMascot">🐥</div>

      <div class="splitwrap">
        <div class="sbox top" id="splitsTop">10</div>
        <svg class="legs" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line x1="50" y1="6" x2="16" y2="94" vector-effect="non-scaling-stroke"></line>
          <line x1="50" y1="6" x2="84" y2="94" vector-effect="non-scaling-stroke"></line>
        </svg>
        <div class="sbot">
          <div class="sbox" id="boxLeft">4</div>
          <div class="sbox" id="boxRight">?</div>
        </div>
      </div>

      <div class="feedback" id="splitsFeedback"></div>
    </main>

    <section class="numpad" id="splitsNumpad">
      <button class="key num" data-key="1">1</button>
      <button class="key num" data-key="2">2</button>
      <button class="key num" data-key="3">3</button>
      <button class="key num" data-key="4">4</button>
      <button class="key num" data-key="5">5</button>
      <button class="key num" data-key="6">6</button>
      <button class="key num" data-key="7">7</button>
      <button class="key num" data-key="8">8</button>
      <button class="key num" data-key="9">9</button>
      <button class="key action clear" data-key="clear" aria-label="Wissen">⌫</button>
      <button class="key num" data-key="0">0</button>
      <button class="key action check" data-key="check" aria-label="Controleer antwoord">✓</button>
    </section>
  </section>

  <!-- ===== Splitsen · feest ===== -->
  <section id="scrFeest" class="screen menu" hidden>
    <header class="topbar">
      <button class="icon-btn js-home" aria-label="Naar het keuzescherm">🏠</button>
      <div class="score push-right" aria-label="Sterren">
        <span class="score-star">⭐</span>
        <span class="js-score">0</span>
      </div>
    </header>
    <div class="menu-body">
      <div class="mascot festive">🏆</div>
      <h2 class="bigq" id="feestTitle">10 op een rij!</h2>
      <p class="home-sub" id="feestSub">Jij bent een splitskampioen! 🎉</p>
      <div class="numchoices">
        <button class="numchoice again" id="btnAgain">Nog een keer! 🔁</button>
        <button class="numchoice other" id="btnOther">Ander getal 🎲</button>
      </div>
    </div>
  </section>

  <!-- ===== Instellingen (Rekenreeksen) ===== -->
  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal">
      <h2 id="settingsTitle">Instellingen 🎛️</h2>

      <div class="setting-block">
        <label class="setting-label" id="lblMax">Hoe hoog gaan we?</label>
        <div class="slider-row">
          <input type="range" id="maxRange" min="5" max="100" step="1" value="20" />
          <span class="max-value" id="maxValue">20</span>
        </div>
      </div>

      <div class="setting-block">
        <label class="setting-label" id="lblOps">Welke sommen?</label>
        <div class="op-toggles" id="opToggles">
          <button class="op-toggle" data-op="+"><span class="op-emoji">➕</span><span class="op-name">Plus</span></button>
          <button class="op-toggle" data-op="-"><span class="op-emoji">➖</span><span class="op-name">Min</span></button>
          <button class="op-toggle" data-op="*"><span class="op-emoji">✖️</span><span class="op-name">Keer</span></button>
          <button class="op-toggle" data-op="/"><span class="op-emoji">➗</span><span class="op-name">Delen</span></button>
        </div>
        <p class="hint" id="opHint"></p>
      </div>

      <div class="setting-block">
        <label class="setting-label" id="lblLang">Taal</label>
        <div class="lang-toggles" id="langToggles">
          <button class="lang-toggle" data-lang="nl"><span class="lang-flag">🇳🇱</span>NL</button>
          <button class="lang-toggle" data-lang="en"><span class="lang-flag">🇬🇧</span>EN</button>
          <button class="lang-toggle" data-lang="fr"><span class="lang-flag">🇫🇷</span>FR</button>
          <button class="lang-toggle" data-lang="es"><span class="lang-flag">🇪🇸</span>ES</button>
        </div>
      </div>

      <button class="big-btn" id="closeSettings">Spelen maar! 🎉</button>
    </div>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti"></canvas>

  <script src="app.js"></script>
</body>
</html>
