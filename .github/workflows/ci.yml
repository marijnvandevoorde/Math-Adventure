name: CI

# Cheap checks so Dependabot updates get tested before they auto-merge:
# - npm: install + compile the TypeScript (app.js, sw.js) and assemble dist/.
# - gradle: configure the Android wrapper (resolves the Android Gradle Plugin
#   on the pinned Gradle wrapper). No Android build: that stays on demand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile is committed, so `npm install` instead of `npm ci`.
      - name: Build web app
        run: |
          npm install --no-audit --no-fund
          npm run build:dist

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Android project
        working-directory: android
        run: ./gradlew --no-daemon help
