<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#18c8ff"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b2a5b" flood-opacity="0.28"/>
    </filter>
    <filter id="text" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2a5b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- sparkles, kept clear of the centre where Play may overlay UI -->
  <g fill="#ffffff" opacity="0.7">
    <path d="M78 96 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M968 372 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6z"/>
    <circle cx="150" cy="410" r="7"/>
    <circle cx="905" cy="92" r="9"/>
    <circle cx="60" cy="270" r="5"/>
  </g>

  <!-- wordmark -->
  <g filter="url(#text)">
    <text x="72" y="214" font-family="Verdana,DejaVu Sans,sans-serif" font-size="60" font-weight="bold" fill="#ffffff">Math Adventure</text>
    <text x="75" y="270" font-family="Verdana,DejaVu Sans,sans-serif" font-size="27" fill="#eaf4ff">Maths practice for ages 6 to 9</text>
  </g>

  <!-- pills: the app's actual selling points -->
  <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="19" font-weight="bold">
    <g filter="url(#card)">
      <rect x="72" y="330" width="110" height="50" rx="25" fill="#ffffff" opacity="0.95"/>
      <rect x="200" y="330" width="172" height="50" rx="25" fill="#ffffff" opacity="0.95"/>
      <rect x="390" y="330" width="170" height="50" rx="25" fill="#ffffff" opacity="0.95"/>
    </g>
    <text x="127" y="362" text-anchor="middle" fill="#3b2a72">No ads</text>
    <text x="286" y="362" text-anchor="middle" fill="#3b2a72">Works offline</text>
    <text x="475" y="362" text-anchor="middle" fill="#3b2a72">4 languages</text>
  </g>

  <!-- 2x2 operator tiles, mirroring the app icon -->
  <g transform="translate(690,110) scale(1.42)" filter="url(#card)">
    <g transform="translate(0,0)">
      <rect width="94" height="94" rx="24" fill="#ffffff"/>
      <g fill="#4d9dff">
        <rect x="39" y="19" width="16" height="56" rx="8"/>
        <rect x="19" y="39" width="56" height="16" rx="8"/>
      </g>
    </g>
    <g transform="translate(110,0)">
      <rect width="94" height="94" rx="24" fill="#ffffff"/>
      <rect x="19" y="39" width="56" height="16" rx="8" fill="#ff6bcb"/>
    </g>
    <g transform="translate(0,110)">
      <rect width="94" height="94" rx="24" fill="#ffffff"/>
      <g fill="#ff9f43" transform="rotate(45 47 47)">
        <rect x="39" y="19" width="16" height="56" rx="8"/>
        <rect x="19" y="39" width="56" height="16" rx="8"/>
      </g>
    </g>
    <g transform="translate(110,110)">
      <rect width="94" height="94" rx="24" fill="#ffffff"/>
      <g fill="#2ecc71">
        <rect x="19" y="39" width="56" height="16" rx="8"/>
        <circle cx="47" cy="27" r="10"/>
        <circle cx="47" cy="67" r="10"/>
      </g>
    </g>
  </g>
</svg>
